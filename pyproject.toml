[project]
name = "idx"
version = "0.1.0"
description = "IDX point-in-time-correct data ingestion pipeline"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "yfinance>=0.2.40",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "structlog>=24.1",
    "python-dotenv>=1.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/idx"]

[tool.pytest.ini_options]
pythonpath = ["src"]
